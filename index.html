<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypot Intro</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #EDEDED;
    }

    body {
      position: relative;
      background: #EDEDED;
    }

    .intro-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #EDEDED;
    }

    .intro-video-desktop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
      background: #EDEDED;
    }

    .intro-ui {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .lang-row {
      position: absolute;
      left: 50%;
      top: calc(50% + 170px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      pointer-events: auto;
    }

    .lang-btn {
      width: 154px;
      height: 70px;
      box-sizing: border-box;
      border: 1px solid #FD6FFF;
      border-radius: 999px;
      background: transparent;
      color: #FD6FFF;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      cursor: pointer;
      font-family: "zpix", sans-serif;
      font-size: 20pt;
      line-height: 1;
      appearance: none;
      -webkit-appearance: none;
    }

    .lang-btn:hover {
      background: rgba(253, 111, 255, 0.06);
    }

    .lang-btn:active {
      transform: translateY(1px);
    }

    .mobile-video-stage {
      display: none;
    }

    .mobile-adjust-panel {
      display: none;
    }

    @media (max-width: 768px), (orientation: portrait) {
      html, body {
        background: #FFFFFF;
      }

      body,
      .intro-root {
        background: #FFFFFF;
      }

      .intro-video-desktop {
        display: none;
      }

      .mobile-video-stage {
        display: block;
        position: absolute;
        left: 50%;
        top: 9vh;
        transform: translateX(-50%);
        width: 100vw;
        height: 78vh;
        overflow: hidden;
        background: #FFFFFF;
      }

      .mobile-video-stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        display: block;
        pointer-events: none;
        background: #FFFFFF;
      }

      .lang-row {
        top: auto;
        bottom: 50vh;
        left: 50%;
        transform: translateX(-50%);
        gap: 12px;
      }

      .lang-btn {
        width: 132px;
        height: 60px;
        font-size: 18pt;
      }

      .mobile-adjust-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: fixed;
        right: 10px;
        top: 10px;
        z-index: 20;
        width: 180px;
        padding: 10px;
        border-radius: 12px;
        background: rgba(255,255,255,0.92);
        box-shadow: 0 8px 24px rgba(0,0,0,0.14);
        font-family: sans-serif;
        pointer-events: auto;
      }

      .mobile-adjust-panel label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: #444;
      }

      .mobile-adjust-panel input[type="range"] {
        width: 100%;
      }

      .mobile-adjust-value {
        font-size: 11px;
        color: #FD6FFF;
      }

      .mobile-adjust-reset {
        height: 34px;
        border: 1px solid #FD6FFF;
        border-radius: 999px;
        background: #fff;
        color: #FD6FFF;
        font-size: 12px;
        cursor: pointer;
      }
    }

    @media (max-width: 480px) {
      .mobile-video-stage {
        top: 8vh;
        height: 58vh;
      }

      .lang-row {
        bottom: 25vh;
        gap: 10px;
      }

      .lang-btn {
        width: 118px;
        height: 54px;
        font-size: 16pt;
      }

      .mobile-adjust-panel {
        width: 170px;
        padding: 8px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .mobile-video-stage {
        top: -18vh;
        height: 115vh;
      }

      .lang-row {
        bottom: 27vh;
      }

      .lang-btn {
        width: 118px;
        height: 54px;
        font-size: 16pt;
      }

      .mobile-adjust-panel {
        width: 170px;
      }
    }
  </style>
</head>
<body>
  <main class="intro-root">
    <video
      class="intro-video-desktop"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="/Emotion.mp4" type="video/mp4" />
    </video>

    <div class="mobile-video-stage" id="mobileVideoStage">
      <video
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
      >
        <source src="/Emotion.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="intro-ui">
      <div class="lang-row" id="langRow">
        <a href="/entry.html" class="lang-btn">中文</a>
        <button type="button" class="lang-btn">English</button>
      </div>
    </div>
  </main>

</body>
</html>
