<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypot Intro</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #EDEDED;
    }

    body {
      position: relative;
      background: #EDEDED;
    }

    .intro-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #EDEDED;
    }

    /* 桌機版影片 */
    .intro-video-desktop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
      background: #EDEDED;
    }

    .intro-ui {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .lang-row {
      position: absolute;
      left: 50%;
      top: calc(50% + 170px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      pointer-events: auto;
    }

    .lang-btn {
      width: 154px;
      height: 70px;
      box-sizing: border-box;
      border: 1px solid #FD6FFF;
      border-radius: 999px;
      background: transparent;
      color: #FD6FFF;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      cursor: pointer;
      font-family: "zpix", sans-serif;
      font-size: 20pt;
      line-height: 1;
      appearance: none;
      -webkit-appearance: none;
    }

    .lang-btn:hover {
      background: rgba(253, 111, 255, 0.06);
    }

    .lang-btn:active {
      transform: translateY(1px);
    }

    /* 手機版容器預設隱藏 */
    .mobile-video-stage {
      display: none;
    }

    /* ===== 手機版 ===== */
    @media (max-width: 768px), (orientation: portrait) {
      html, body {
        background: #FFFFFF;
      }

      body,
      .intro-root {
        background: #FFFFFF;
      }

      .intro-video-desktop {
        display: none;
      }

      .mobile-video-stage {
        display: block;
        position: absolute;
        left: 50%;
        top: 12vh;
        transform: translateX(-50%);
        width: 100vw;
        height: 42vh;
        overflow: hidden;
        background: #FFFFFF;
      }

      .mobile-video-stage video {
        position: absolute;
        left: 50%;
        top: 50%;
        width: auto;
        height: 100%;
        min-width: 100%;
        transform: translate(-50%, -50%);
        object-fit: cover;
        object-position: center center;
        display: block;
        pointer-events: none;
        background: #FFFFFF;
      }

      .lang-row {
        top: auto;
        bottom: 12vh;
        left: 50%;
        transform: translateX(-50%);
        gap: 12px;
      }

      .lang-btn {
        width: 132px;
        height: 60px;
        font-size: 18pt;
      }
    }

    /* 小手機 */
    @media (max-width: 480px) {
      .mobile-video-stage {
        top: 10vh;
        height: 40vh;
      }

      .lang-row {
        bottom: 11vh;
        gap: 10px;
      }

      .lang-btn {
        width: 118px;
        height: 54px;
        font-size: 16pt;
      }
    }

    /* 很矮的手機橫向 */
    @media (max-height: 500px) and (orientation: landscape) {
      .mobile-video-stage {
        top: 6vh;
        height: 55vh;
      }

      .lang-row {
        bottom: 7vh;
      }

      .lang-btn {
        width: 118px;
        height: 54px;
        font-size: 16pt;
      }
    }
  </style>
</head>
<body>
  <main class="intro-root">
    <video
      class="intro-video-desktop"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="/motion.mp4" type="video/mp4" />
    </video>

    <div class="mobile-video-stage">
      <video
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
      >
        <source src="/motion.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="intro-ui">
      <div class="lang-row">
        <a href="/white.html" class="lang-btn">中文</a>
        <button type="button" class="lang-btn">English</button>
      </div>
    </div>
  </main>
</body>
</html>
