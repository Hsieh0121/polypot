<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypot Intro</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #EDEDED;
    }

    body {
      position: relative;
      background: #EDEDED;
    }

    .intro-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #EDEDED;
    }

    /* 桌機版：影片滿版 */
    .intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
      background: #EDEDED;
    }

    .intro-ui {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* 桌機版按鈕 */
    .lang-row {
      position: absolute;
      left: 50%;
      top: calc(50% + 170px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      pointer-events: auto;
    }

    .lang-btn {
      width: 154px;
      height: 70px;
      box-sizing: border-box;
      border: 1px solid #FD6FFF;
      border-radius: 999px;
      background: transparent;
      color: #FD6FFF;
      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      margin: 0;
      cursor: pointer;

      font-family: "zpix", sans-serif;
      font-size: 20pt;
      line-height: 1;

      appearance: none;
      -webkit-appearance: none;
    }

    .lang-btn:hover {
      background: rgba(253, 111, 255, 0.06);
    }

    .lang-btn:active {
      transform: translateY(1px);
    }

    /* ===== 手機 / 平板直向：改成手機版構圖 ===== */
    @media (max-width: 768px), (orientation: portrait) {
      .intro-root {
        background: #EDEDED;
      }

      .intro-video {
        inset: auto;
        left: 50%;
        top: 22%;
        transform: translateX(-50%);
        width: 100%;
        height: 34vh;
        object-fit: contain;
        object-position: center center;
        background: transparent;
      }

      .lang-row {
        top: auto;
        bottom: 11vh;
        left: 50%;
        transform: translateX(-50%);
        gap: 12px;
      }

      .lang-btn {
        width: 132px;
        height: 60px;
        font-size: 18pt;
      }
    }

    /* ===== 小手機再細修 ===== */
    @media (max-width: 480px) {
      .intro-video {
        top: 20%;
        height: 30vh;
      }

      .lang-row {
        bottom: 10vh;
        gap: 10px;
      }

      .lang-btn {
        width: 118px;
        height: 54px;
        font-size: 16pt;
      }
    }

    /* ===== 很矮的手機橫向，避免按鈕卡太下 ===== */
    @media (max-height: 500px) and (orientation: landscape) {
      .lang-row {
        top: auto;
        bottom: 8vh;
      }

      .lang-btn {
        width: 118px;
        height: 54px;
        font-size: 16pt;
      }
    }
  </style>
</head>
<body>
  <main class="intro-root">
    <video
      class="intro-video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="/motion.mp4" type="video/mp4" />
    </video>

    <div class="intro-ui">
      <div class="lang-row">
        <a href="/white.html" class="lang-btn">中文</a>
        <button type="button" class="lang-btn">English</button>
      </div>
    </div>
  </main>
</body>
</html>
